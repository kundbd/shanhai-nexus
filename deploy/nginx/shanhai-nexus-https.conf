server {
    listen 80;
    listen [::]:80;
    server_name shanhainexus.com www.shanhainexus.com;

    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/shanhai-nexus;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://shanhainexus.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name shanhainexus.com;

    ssl_certificate /etc/letsencrypt/live/shanhainexus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shanhainexus.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=86400" always;
    access_log off;

    location = /api/community/posts {
        client_max_body_size 25m;
        client_body_timeout 30s;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:3180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 443 ssl;
    server_name www.shanhainexus.com;

    ssl_certificate /etc/letsencrypt/live/shanhainexus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shanhainexus.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;

    return 308 https://shanhainexus.com$request_uri;
}
